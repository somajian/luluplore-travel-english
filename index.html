<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>luluplore-travel-english</title>
<meta name="description" content="Luluplore 旅行英文 — 出國前臨時抱佛腳，也適合平常慢慢學的旅行英文小工具">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;0,900;1,500;1,600&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;0,800;1,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  /* ---------- tokens ---------- */
  :root{
    --bg:#EEE3C5;
    --bg-alt:#F5E6B8;
    /* Luluplore card surface — matches the 旅行規劃 All in One tool: a soft,
       slightly translucent warm white layered over the tan page background,
       not a flat opaque white card. */
    --surface:rgba(255,255,255,0.6);
    --surface-2:rgba(255,255,255,0.4);
    --ink:#3D2E14;
    --ink-soft:#6E5A34;
    --ink-faint:#A0895A;
    --amber:#F5C445;
    --amber-deep:#A9740A;
    --amber-bg:#FCEAB0;
    --coral:#EF8B4C;
    --coral-bg:#FCE3D0;
    --sprout:#5F8E52;
    --sprout-bg:#E7F0DF;
    --line:#E6D093;
    --shadow: rgba(61,46,20,0.12);
    --focus:#A9740A;
    /* Luluplore brand navy — shared with the 旅行規劃 All in One tool's
       headline/CTA color, so the two apps read as one family. Used only
       for headings and primary buttons; body copy stays warm brown/amber. */
    --navy:#1B2A4A;
    --navy-soft:#5B6478;

    --font-display:'Fraunces', 'Iowan Old Style', ui-serif, Georgia, serif;
    --font-body:'Nunito Sans', -apple-system, 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    --font-mono:'Space Mono', 'SFMono-Regular', Menlo, monospace;

    --radius-sm:10px;
    --radius-md:16px;
    --radius-lg:26px;

    --container: 760px;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#231B0E;
      --bg-alt:#2C2210;
      --surface:#302512;
      --surface-2:#362A15;
      --ink:#FBEED2;
      --ink-soft:#D6C296;
      --ink-faint:#A08F67;
      --amber:#F6C445;
      --amber-deep:#FBDD86;
      --amber-bg:#4A3A14;
      --coral:#F0996A;
      --coral-bg:#4A2E18;
      --sprout:#93C084;
      --sprout-bg:#2B3A21;
      --line:#493A1D;
      --shadow: rgba(0,0,0,0.45);
      --focus:#FBDD86;
      --navy:#AABEE0;
      --navy-soft:#9CA6C2;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1C1722;
    --bg-alt:#241D2C;
    --surface:#2A2233;
    --surface-2:#2F2739;
    --ink:#F3ECE4;
    --ink-soft:#BBAFC4;
    --ink-faint:#8A7E92;
    --amber:#EFAD57;
    --amber-deep:#F7C883;
    --amber-bg:#3B2C18;
    --coral:#F09079;
    --coral-bg:#3A241F;
    --sprout:#8FC189;
    --sprout-bg:#243421;
    --line:#3B3345;
    --shadow: rgba(0,0,0,0.45);
    --focus:#F7C883;
    --navy:#B9C6E8;
    --navy-soft:#A9B3CE;
  }

  *,*::before,*::after{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:16px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
  }
  h1,h2,h3{ font-family:var(--font-display); font-weight:700; margin:0; text-wrap:balance; color:var(--navy); }
  p{ margin:0; }
  button{ font-family:inherit; }
  a{ color:inherit; }
  ::selection{ background:var(--amber); color:#241505; }
  :focus-visible{ outline:2px solid var(--focus); outline-offset:2px; border-radius:6px; }

  .mono-label{
    font-family:var(--font-mono);
    font-size:0.72rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-faint);
  }

  /* ---------- shell ---------- */
  #app{ min-height:100vh; display:flex; flex-direction:column; }

  main{ flex:1; }
  .view{ display:none; }
  .view.active{ display:block; }

  .wrap{ max-width:var(--container); margin:0 auto; padding:0 clamp(16px,4vw,40px); }
  .wrap-wide{ max-width:980px; margin:0 auto; padding:0 clamp(16px,4vw,40px); }

  /* ---------- buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    font-weight:800; font-size:0.98rem; font-family:var(--font-body);
    padding:13px 26px; border-radius:999px; border:1px solid transparent;
    cursor:pointer; transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
    text-decoration:none; white-space:nowrap;
  }
  .btn:active{ transform:translateY(1px); }
  .btn-primary{ background:var(--navy); color:var(--bg); box-shadow:0 6px 18px -6px var(--shadow); }
  .btn-primary:hover{ background:var(--amber-deep); color:#241505; }
  .btn-secondary{ background:transparent; color:var(--ink); border-color:var(--ink); }
  .btn-secondary:hover{ background:var(--surface); }
  .btn-ghost{ background:var(--surface); color:var(--ink); border-color:var(--line); }
  .btn-ghost:hover{ border-color:var(--amber); }
  .btn-sm{ padding:8px 16px; font-size:0.85rem; }
  .btn-block{ width:100%; }
  .btn[disabled]{ opacity:0.5; cursor:not-allowed; }
  .icon-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:40px; height:40px; border-radius:50%;
    background:var(--surface); border:1px solid var(--line); color:var(--ink);
    cursor:pointer;
  }
  .icon-btn:hover{ border-color:var(--amber); }
  .icon-btn.recording{ background:var(--coral); color:#fff; border-color:var(--coral); animation:pulse 1.4s ease-in-out infinite; }
  .icon-btn-sm{ width:30px; height:30px; font-size:0.85rem; flex-shrink:0; }
  @keyframes pulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(234,111,82,.45);} 50%{ box-shadow:0 0 0 9px rgba(234,111,82,0);} }

  /* =========================================================
     HOME
     ========================================================= */
  .hero{
    position:relative;
    padding:clamp(28px,5vw,44px) 0 clamp(18px,3vw,26px);
    /* Flat, matching the 旅行規劃 All in One home — no glow/gradient overlay. */
  }
  .hero-inner{ position:relative; z-index:1; }
  .hero h1{
    font-size:clamp(1.25rem, 1vw + 1rem, 1.55rem);
    line-height:1.3; letter-spacing:-0.01em; max-width:20ch; color:var(--navy);
  }
  .hero-sub{
    margin-top:10px; font-size:clamp(0.8rem,0.2vw + .7rem,0.86rem); color:var(--ink-soft);
    max-width:46ch; line-height:1.6;
  }
  .hero-byline{
    margin-top:12px; font-family:var(--font-mono); font-size:0.62rem; font-weight:700;
    letter-spacing:0.14em; color:var(--ink-faint);
  }

  .loop-section{ padding:clamp(48px,8vw,80px) 0; }
  .section-head{ max-width:52ch; margin-bottom:clamp(28px,5vw,44px); }
  .section-head .mono-label{ margin-bottom:10px; display:block; }
  .section-head h2{ font-size:clamp(1.5rem,2.4vw+.8rem,2.1rem); }

  .loop-row{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:14px;
  }
  .loop-step{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md);
    padding:20px 18px; display:flex; flex-direction:column; gap:10px; position:relative;
  }
  .loop-step .num{ font-family:var(--font-mono); font-size:0.75rem; color:var(--ink-faint); }
  .loop-step .label{ font-weight:800; font-size:1rem; }
  .loop-step .desc{ font-size:0.87rem; color:var(--ink-soft); }

  .why-section{ padding:0 0 clamp(56px,9vw,90px); }
  .why-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:22px; }
  .why-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md);
    padding:24px 22px; transition:border-color .15s ease, transform .15s ease;
  }
  .why-card:hover{ border-color:var(--amber); transform:translateY(-2px); }
  .why-card h3{ font-size:1.15rem; margin-bottom:8px; }
  .why-card p{ color:var(--ink-soft); font-size:0.94rem; }
  .why-card .glyph{ font-size:1.6rem; margin-bottom:12px; display:block; }

  /* =========================================================
     SCENARIOS
     ========================================================= */
  .page-head{ padding:clamp(36px,6vw,56px) 0 clamp(20px,4vw,28px); }
  .page-head h2{ font-size:clamp(1.7rem,3vw+.8rem,2.4rem); }
  .page-head p{ color:var(--ink-soft); margin-top:10px; max-width:56ch; font-size:1.02rem; }

  .cat-tabs{ display:flex; gap:10px; margin:22px 0 26px; flex-wrap:wrap; }
  .cat-tab{
    font-family:var(--font-mono); font-size:0.78rem; letter-spacing:0.03em;
    padding:9px 16px; border-radius:999px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink-soft); cursor:pointer;
  }
  .cat-tab.active{ background:var(--ink); color:var(--bg); border-color:var(--ink); }

  .scenario-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:16px; padding-bottom:60px;
  }
  .scenario-card{
    text-align:left; cursor:pointer; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius-md); padding:20px; display:flex; flex-direction:column; gap:10px;
    transition:border-color .15s ease, transform .15s ease;
  }
  .scenario-card:hover{ border-color:var(--amber); transform:translateY(-2px); }
  .scenario-card .cat-flag{ font-family:var(--font-mono); font-size:0.68rem; letter-spacing:0.07em; color:var(--ink-faint); }
  .scenario-card h3{ font-size:1.12rem; }
  .scenario-card .desc{ font-size:0.9rem; color:var(--ink-soft); flex:1; }
  .scenario-meta{ display:flex; gap:8px; flex-wrap:wrap; margin-top:4px; }
  .tag-pill{
    font-family:var(--font-mono); font-size:0.68rem; letter-spacing:0.03em;
    padding:4px 10px; border-radius:999px; background:var(--bg-alt); color:var(--ink-soft);
    border:1px solid var(--line);
  }
  .tag-pill.diff-beginner{ background:var(--sprout-bg); color:var(--sprout); border-color:transparent; }
  .tag-pill.diff-intermediate{ background:var(--coral-bg); color:var(--coral); border-color:transparent; }

  /* =========================================================
     PRACTICE
     ========================================================= */
  .practice-shell{ padding:clamp(24px,5vw,40px) 0 90px; }
  .back-row{ display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  .back-link{ background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:0.9rem;font-weight:700; display:flex; align-items:center; gap:6px; padding:4px; }
  .back-link:hover{ color:var(--ink); }

  .context-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg);
    padding:22px 24px; margin-bottom:18px;
  }
  .context-card .mono-label{ margin-bottom:8px; }
  .context-card h2{ font-size:1.3rem; margin-bottom:8px; }
  .context-card .ctx-text{ color:var(--ink-soft); font-size:0.98rem; }
  .context-meta{ display:flex; gap:8px; margin-top:14px; }

  /* multi-turn conversation UI */
  .conv-progress{ display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  .conv-dots{ display:flex; gap:6px; }
  .conv-dot{ width:9px; height:9px; border-radius:50%; background:var(--bg-alt); border:1px solid var(--line); }
  .conv-dot.done{ background:var(--sprout); border-color:var(--sprout); }
  .conv-dot.current{ background:var(--amber); border-color:var(--amber); }
  .conv-step-label{ font-family:var(--font-mono); font-size:0.72rem; letter-spacing:0.04em; color:var(--ink-faint); }

  .conv-log{ margin-bottom:18px; display:flex; flex-direction:column; gap:10px; }
  .conv-log-item{
    background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-md);
    padding:12px 16px; font-size:0.88rem; opacity:0.82;
  }
  .conv-log-ai{ font-weight:700; margin-bottom:4px; }
  .conv-log-user{ color:var(--ink-soft); font-style:italic; margin-bottom:4px; }
  .conv-log-fb{ color:var(--ink-faint); font-size:0.84rem; }

  .conv-complete{ display:none; margin-top:10px; }
  .conv-complete.open{ display:block; animation:rise .35s ease; }
  .conv-complete-inner{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg);
    padding:32px 28px; text-align:center;
  }
  .conv-complete-glyph{ font-size:2.2rem; margin-bottom:8px; }
  .conv-complete-inner h2{ font-size:1.5rem; margin-bottom:8px; }
  .conv-complete-sub{ color:var(--ink-soft); font-size:0.98rem; margin-bottom:20px; }
  .conv-checklist{
    list-style:none; margin:0 0 24px; padding:0; display:inline-flex; flex-direction:column; gap:8px;
    text-align:left; color:var(--sprout); font-weight:700; font-size:0.95rem;
  }
  .conv-complete-inner .fb-block{ text-align:left; margin-bottom:20px; }
  .conv-complete-inner .feedback-cta{ justify-content:center; }

  .chat-bubble{
    display:flex; gap:12px; align-items:flex-start; margin:22px 0;
  }
  .avatar{
    width:36px; height:36px; border-radius:50%; flex-shrink:0;
    background:radial-gradient(circle at 32% 28%, #FFF3C4, var(--amber) 55%, var(--coral) 100%);
    display:flex; align-items:center; justify-content:center; font-size:1rem;
  }
  .bubble-content{
    background:var(--surface); border:1px solid var(--line); border-radius:4px 18px 18px 18px;
    padding:14px 18px; font-size:1.02rem; max-width:520px;
    display:flex; align-items:flex-start; gap:12px;
  }
  .bubble-content .bubble-text{ flex:1; min-width:0; }
  .bubble-content .icon-btn{ width:34px; height:34px; flex-shrink:0; }
  .opening-gloss{
    display:block; margin-top:6px; font-size:0.86rem; color:var(--ink-faint); font-style:italic;
  }

  .answer-block{ margin-top:6px; }
  .answer-block label{ display:block; font-weight:800; margin-bottom:10px; font-size:0.95rem; }
  textarea#answerInput{
    width:100%; min-height:100px; resize:vertical; font-family:var(--font-body); font-size:1.02rem;
    padding:16px 18px; border-radius:var(--radius-md); border:1px solid var(--line);
    background:var(--surface); color:var(--ink); line-height:1.5;
  }
  textarea#answerInput:focus{ border-color:var(--amber); }
  .answer-actions{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:12px; flex-wrap:wrap; }
  .answer-actions-left{ display:flex; align-items:center; gap:10px; }
  .rec-status{ font-size:0.82rem; color:var(--ink-faint); }

  .help-link{
    background:none; border:none; color:var(--amber-deep); font-weight:800; cursor:pointer;
    font-size:0.92rem; padding:6px 0; margin-top:16px; display:inline-flex; align-items:center; gap:6px;
  }
  .help-link:hover{ text-decoration:underline; }

  .help-panel{
    margin-top:14px; background:var(--bg-alt); border:1px solid var(--line); border-radius:var(--radius-md);
    padding:18px 20px; display:none;
  }
  .help-panel.open{ display:block; }
  .help-panel textarea{
    width:100%; min-height:56px; margin-top:10px; padding:12px 14px; border-radius:var(--radius-sm);
    border:1px solid var(--line); font-family:var(--font-body); font-size:0.98rem; background:var(--surface); color:var(--ink);
  }
  .help-result{ margin-top:16px; display:none; }
  .help-result.open{ display:block; }

  /* feedback */
  .feedback-panel{ margin-top:34px; display:none; }
  .feedback-panel.open{ display:block; animation:rise .35s ease; }
  @keyframes rise{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:translateY(0);} }

  .result-banner{
    display:flex; align-items:center; gap:14px;
    background:var(--sprout-bg); border-radius:var(--radius-lg); padding:20px 24px; margin-bottom:20px;
  }
  .result-banner.result-soft{ background:var(--amber-bg); }
  .result-banner .glyph{ font-size:1.8rem; }
  .result-banner .msg{ font-weight:800; font-size:1.12rem; color:var(--ink); }
  .result-banner .sub{ font-size:0.88rem; color:var(--ink-soft); margin-top:2px; }

  .fb-block{ margin-bottom:20px; }
  .fb-block .mono-label{ margin-bottom:8px; }
  .quote-card{
    border-left:3px solid var(--line); padding:10px 16px; font-style:italic; color:var(--ink-soft);
    font-size:0.98rem; background:var(--surface-2); border-radius:0 var(--radius-sm) var(--radius-sm) 0;
  }
  .quote-card-row{ display:flex; align-items:center; gap:10px; }
  .quote-card-row .quote-card{ flex:1; min-width:0; }
  .natural-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md);
    padding:18px 20px; display:flex; align-items:flex-start; justify-content:space-between; gap:14px;
  }
  .natural-card .text{ font-size:1.15rem; font-weight:700; font-family:var(--font-display); }

  .phrase-card{
    background:var(--amber-bg); border-radius:var(--radius-md); padding:18px 20px;
  }
  .phrase-card .phrase{ font-family:var(--font-display); font-weight:700; font-size:1.15rem; color:var(--amber-deep); }
  .phrase-card .explain{ margin-top:6px; font-size:0.92rem; color:var(--ink-soft); }

  .vocab-row{ display:flex; flex-wrap:wrap; gap:10px; }
  .vocab-chip{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:10px 14px; font-size:0.88rem; max-width:260px;
  }
  .vocab-chip b{ font-family:var(--font-display); }
  .vocab-chip .m{ color:var(--ink-soft); display:block; margin-top:2px; }

  .grammar-note{ font-size:0.92rem; color:var(--ink-soft); background:var(--surface-2); padding:12px 16px; border-radius:var(--radius-sm); }

  .say-it-module{
    margin-top:26px; border-top:1px solid var(--line); padding-top:22px;
  }
  .say-it-controls{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-top:14px; }
  .say-it-hint{ font-size:0.85rem; color:var(--ink-faint); margin-top:10px; }
  audio.playback{ height:36px; }

  .feedback-cta{ display:flex; gap:12px; margin-top:26px; flex-wrap:wrap; }

  /* =========================================================
     TRAVEL ENGLISH CARDS
     ========================================================= */
  .hero-travel-link{
    margin-top:16px; background:none; border:none; padding:6px 0; cursor:pointer;
    font-weight:800; font-size:0.92rem; color:var(--amber-deep); display:inline-flex; align-items:center; gap:6px;
  }
  .hero-travel-link:hover{ text-decoration:underline; }

  .travel-flow-section{ padding:clamp(4px,1vw,10px) 0 clamp(44px,7vw,64px); }
  .travel-flow-row{ display:flex; flex-direction:column; align-items:stretch; gap:2px; max-width:520px; margin:0 auto; }
  .travel-flow-tile{
    width:100%; text-align:left; cursor:pointer;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg);
    padding:22px 20px; display:flex; flex-direction:column; gap:8px;
    transition:border-color .15s ease, transform .15s ease;
  }
  .travel-flow-tile:hover{ border-color:var(--amber); transform:translateY(-2px); }
  .travel-flow-tile .step{ font-family:var(--font-mono); font-size:0.68rem; letter-spacing:0.06em; color:var(--ink-faint); }
  .travel-flow-tile .glyph{ font-size:1.8rem; }
  .travel-flow-tile .title{ font-family:var(--font-display); font-weight:800; font-size:1.05rem; color:var(--navy); }
  .travel-flow-tile .desc{ color:var(--ink-soft); font-size:0.85rem; line-height:1.5; }
  .travel-flow-tile .cta{ font-weight:800; color:var(--amber-deep); font-size:0.86rem; margin-top:2px; }
  .travel-flow-arrow{
    display:flex; align-items:center; justify-content:center;
    color:var(--amber-deep); font-size:1.4rem; padding:4px 0;
  }

  .travel-search-row{ margin:20px 0 18px; }
  .travel-search-input{
    width:100%; padding:14px 18px; border-radius:999px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); font-family:var(--font-body); font-size:1rem;
  }
  .travel-search-input:focus{ border-color:var(--amber); }

  .travel-cat-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:12px; margin-bottom:22px;
  }
  .travel-cat-tile{
    text-align:left; cursor:pointer; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius-md); padding:18px 16px; display:flex; flex-direction:column; gap:8px;
    transition:border-color .15s ease, transform .15s ease;
  }

  function travelCardById(id){ for(var i=0;i<TRAVEL_CARDS.length;i++){ if(TRAVEL_CARDS[i].id===id) return TRAVEL_CARDS[i]; } return null; }

  function byId(id){ return document.getElementById(id); }
  function scenarioById(id){ for(var i=0;i<SCENARIOS.length;i++){ if(SCENARIOS[i].id===id) return SCENARIOS[i]; } return null; }
  function t(key){ return UI[state.lang][key]; }
  function loc(scenario, field){
    if(state.lang==="zh" && scenario[field+"Zh"]!=null) return scenario[field+"Zh"];
    return scenario[field];
  }

  /* ============================================================
     THEME TOGGLE (light / dark) — explicit override so the app's
     brand colors (navy headings + cream background, matching the
     Luluplore 旅行規劃 All in One tool) show consistently instead of
     silently following the visitor's OS/browser dark-mode setting.
     Defaults to light on a first visit; remembered per-device after
     that via localStorage, same pattern as everything else here.
     ============================================================ */
  var THEME_KEY = "speakfirst_theme";
  function loadTheme(){
    try{
      var saved = localStorage.getItem(THEME_KEY);
      return (saved === "light" || saved === "dark") ? saved : "light";
    }catch(e){ return "light"; }
  }
  function saveTheme(theme){
    try{ localStorage.setItem(THEME_KEY, theme); }catch(e){ /* storage unavailable — fail silently */ }
  }
  var currentTheme = loadTheme();
  function applyTheme(theme){
    currentTheme = theme;
    document.documentElement.setAttribute("data-theme", theme);
  }

  /* ============================================================
     LANGUAGE — no manual switcher in the UI; defaults to zh and
     stays there unless a saved preference from an earlier session
     says otherwise (see savedLang read above).
     ============================================================ */
  function setLang(lang){
    state.lang = lang;
    try{ localStorage.setItem("speakfirst_lang", lang); }catch(e){}
    applyTheme(currentTheme);
    applyStaticText();
    renderTravelFlowRow();
    renderCatTabs();
    if(state.view==="scenarios") renderScenarios();
    if(state.view==="practice" && state.currentScenarioId){
      var activeScenario = scenarioById(state.currentScenarioId);
      if(state.conv && activeScenario){
        if(byId("convComplete").classList.contains("open")){
          finishConversation(activeScenario);
        } else {
          updateConversationTurnText(activeScenario);
        }
      } else {
        updatePracticeText();
        if(state.lastFeedback) renderFeedback(state.lastFeedback.scenario, state.lastFeedback.answer, state.lastFeedback.fb);
      }
      if(state.lastHelpMatch) renderHelpResult(state.lastHelpMatch);
    }
    if(state.view==="travel") renderTravelEntryGrid();
    if(state.view==="travel-cards") renderTravelView();
    if(state.view==="travel-words") renderWordsView();
  }

  /* ============================================================
     ROUTING
     ============================================================ */
  function navigate(view, opts){
    opts = opts || {};
    state.view = view;
    document.querySelectorAll(".view").forEach(function(v){ v.classList.remove("active"); });
    byId("view-"+view).classList.add("active");
    document.querySelectorAll(".nav-link").forEach(function(n){
      var nv = n.getAttribute("data-nav");
      n.classList.toggle("active", nv===view);
    });
    if(view==="scenarios") renderScenarios();
    if(view==="practice" && opts.scenarioId) openScenario(opts.scenarioId, opts.variantIndex||0);
    if(view==="travel") renderTravelEntryGrid();
    if(view==="travel-cards"){
      renderTravelView();
      if(opts.openCardId) openCardById(opts.openCardId);
    }
    if(view==="travel-words"){
      renderWordsView();
      if(opts.openWordId) openWordById(opts.openWordId);
    }
    window.scrollTo({top:0, behavior:"instant" in window ? "instant":"auto"});
  }

  document.querySelectorAll("[data-nav]").forEach(function(btn){
    btn.addEventListener("click", function(){ navigate(btn.getAttribute("data-nav")); });
  });

  /* ============================================================
     HOME — Travel English flow showcase (單字 → 實用英文 → 情境練習)
     ============================================================ */
  function renderTravelFlowRow(){
    var row = byId("travelFlowRow");
    var steps = [
      {glyph:"🔤", titleKey:"travelEntryWordsTitle", descKey:"travelEntryWordsDesc", ctaKey:"flowCtaWords", view:"travel-words"},
      {glyph:"💬", titleKey:"travelEntryCardsTitle", descKey:"travelEntryCardsDesc", ctaKey:"flowCtaCards", view:"travel-cards"},
      {glyph:"🎤", titleKey:"travelEntryPracticeTitle", descKey:"travelEntryPracticeDesc", ctaKey:"flowCtaPractice", view:"scenarios"}
    ];
    var html = "";
    steps.forEach(function(s, i){
      if(i>0) html += '<div class="travel-flow-arrow">↓</div>';
      html += '<button class="travel-flow-tile" data-view="'+s.view+'">'+
        '<span class="step">STEP '+(i+1)+'</span>'+
        '<span class="glyph">'+s.glyph+'</span>'+
        '<span class="title">'+t(s.titleKey)+'</span>'+
        '<span class="desc">'+t(s.descKey)+'</span>'+
        '<span class="cta">'+t(s.ctaKey)+'</span>'+
      '</button>';
    });
    row.innerHTML = html;
    row.querySelectorAll(".travel-flow-tile").forEach(function(el){
      el.addEventListener("click", function(){
        navigate(el.getAttribute("data-view"));
      });
    });
  }

  /* ============================================================
     PRACTICE VIEW
     ============================================================ */
  function currentVariant(s){
    return state.variantIndex>0 ? s.variants[(state.variantIndex-1) % s.variants.length] : null;
  }

  /* The "active teaching content" for whatever's on screen right now: the
     current turn of a multi-turn conversation scenario, or (for the older,
     single-shot scenarios) the current "Try Again" variant. Both are shaped
     the same way (context/opening/keyPhrase/natural/vocab/keywords), so the
     same evaluateAnswer()/resolveContent() engine works for either. */
  function activeContent(s){
    return state.conv ? resolveTurn(s, state.conv.turnIndex) : currentVariant(s);
  }

  /* A variant/turn may override the teaching content (keyPhrase, natural version,
     vocab, grammar, keywords) so that when several real sentences are grouped
     under one scenario — via "Try Again" variants, or via conversation turns —
     each one is still taught and evaluated with its own correct target phrase,
     not the scenario's. */
  /* Lightweight adaptivity for multi-turn conversations: a conversation turn
     may define `branches` instead of a single fixed opening/keyPhrase/etc.
     Each branch has a `match` list of keywords; we look at what the user
     typed in the *previous* turn (stored in state.conv.history) and pick the
     first branch whose keyword appears in that answer, falling back to the
     branch marked `default` (or the last branch) if nothing matches. This is
     still keyword-matching, not real language understanding — it doesn't
     "read" the sentence, it just checks whether a handful of known words show
     up in it — but it's enough to make a follow-up line feel responsive
     within this app's rule-based, no-backend engine. */
  function pickConversationBranch(turn, prevAnswer){
    var lower = (prevAnswer || "").toLowerCase();
    var fallback = null;
    for(var i=0;i<turn.branches.length;i++){
      var b = turn.branches[i];
      if(b.default){ fallback = fallback || b; continue; }
      if(b.match && b.match.some(function(kw){ return lower.indexOf(kw)!==-1; })){ return b; }
    }
    return fallback || turn.branches[turn.branches.length-1];
  }

  function resolveTurn(s, idx){
    var turn = s.conversation[idx];
    if(!turn.branches) return turn;
    var prevRecord = state.conv.history[idx-1];
    var branch = pickConversationBranch(turn, prevRecord ? prevRecord.answer : "");
    var merged = {};
    for(var k in turn){ if(k!=="branches") merged[k] = turn[k]; }
    for(var k2 in branch){ if(k2!=="match" && k2!=="default") merged[k2] = branch[k2]; }
    return merged;
  }

  function resolveContent(scenario, variant){
    return {
      keyPhrase: (variant && variant.keyPhrase) || scenario.keyPhrase,
      keyExplain: (variant && variant.keyExplain) || scenario.keyExplain,
      keyExplainZh: (variant && variant.keyExplainZh) || scenario.keyExplainZh,
      natural: (variant && variant.natural) || scenario.natural,
      vocab: (variant && variant.vocab) || scenario.vocab,
      grammar: (variant && variant.hasOwnProperty("grammar")) ? variant.grammar : scenario.grammar,
      grammarZh: (variant && variant.hasOwnProperty("grammarZh")) ? variant.grammarZh : scenario.grammarZh,
      keywords: (variant && variant.keywords) || scenario.keywords
    };
  }

  /* Self-adaptive feedback: if the turn/variant just answered defines
     `replyBranches`, look at what the user actually typed for THIS turn
     (not a previous one — see pickConversationBranch() for that) and pick
     the branch whose keyword appears in it, so the "natural way to say
     it" / "what you need today" feedback reflects their own words instead
     of one hardcoded example. Falls back to the branch marked `default`
     (or does nothing) when nothing matches. */
  function pickReplyBranch(turnOrVariant, answer){
    if(!turnOrVariant || !turnOrVariant.replyBranches) return null;
    var lower = (answer || "").toLowerCase();
    var fallback = null;
    var branches = turnOrVariant.replyBranches;
    for(var i=0;i<branches.length;i++){
      var b = branches[i];
      if(b.default){ fallback = fallback || b; continue; }
      if(b.match && b.match.some(function(kw){ return lower.indexOf(kw)!==-1; })) return b;
    }
    return fallback;
  }

  function advanceConversation(s){
    var pending = state.conv.pending;
    freezeTurnToLog(pending.turn, pending.answer, pending.fb);

    state.conv.helpUsedThisTurn = false;
    state.conv.turnIndex++;

    byId("feedbackPanel").classList.remove("open");
    byId("feedbackPanel").innerHTML = "";

    if(state.conv.turnIndex >= s.conversation.length){
      finishConversation(s);

      renderConversationTurnUI(s);

      state.recordStream = stream;

      state.recorder = rec;
      rec.ondataavailable = function(e){ if(e.data.size>0) state.recordedChunks.push(e.data); };
      rec.onstop = function(){
        stream.getTracks().forEach(function(tr){ tr.stop(); });
        byId("recStatus").textContent = t("recDone");
      };
      rec.start();
      state.recordingActive = true;
      micBtn.classList.add("recording");
      byId("recStatus").textContent = t("recRecording");

      byId("recStatus").textContent = t("recNoMic");

  /* ---------- submit answer → simulated AI feedback ---------- */
  byId("submitBtn").addEventListener("click", function(){
    var answer = byId("answerInput").value.trim();
    if(!answer){
      byId("answerInput").focus();
      byId("answerInput").placeholder = t("answerPlaceholderRetry");
      return;
    }
    var s = scenarioById(state.currentScenarioId);
    var turnOrVariant = activeContent(s);
    var feedback = evaluateAnswer(s, answer, turnOrVariant);

    if(state.conv){
      // Mode 1/2 (successful / understandable-but-improvable) → advance the
      // conversation once the user continues. Mode 3 (needs help) → let them
      // see the phrase and try this same turn again once before moving on,
      // so the practice never turns into a dead end.
      var needsHelp = feedback.bucket === "unclear" || feedback.bucket === "unclear-soft";
      var isRetry = needsHelp && !state.conv.helpUsedThisTurn;
      if(needsHelp) state.conv.helpUsedThisTurn = true;
      var isLast = state.conv.turnIndex === s.conversation.length - 1;
      state.conv.pending = {turn:turnOrVariant, answer:answer, fb:feedback};
      renderFeedback(s, answer, feedback, {mode:"conversation", needsRetry:isRetry, isLast:isLast});
    } else {
      state.lastFeedback = {scenario:s, answer:answer, fb:feedback};
      renderFeedback(s, answer, feedback);
    }
  });

  /* ---------- the mock "AI" evaluation engine ---------- */
  function evaluateAnswer(scenario, answer, variant){
    var rc = resolveContent(scenario, variant);
    // Self-adaptive feedback (see pickReplyBranch): a turn's `keywords` list
    // often accepts several different valid words (e.g. any drink), but the
    // displayed keyPhrase/natural version used to always show one fixed
    // example. If this turn/variant defines replyBranches, swap in the
    // branch that matches what the user actually typed — bucket grading
    // below (hits/closeToNatural) then runs against the corrected content,
    // so it's both more accurate and honest about what was said.
    var replyBranch = pickReplyBranch(variant, answer);
    if(replyBranch){
      rc = {
        keyPhrase: replyBranch.keyPhrase || rc.keyPhrase,
        keyExplain: replyBranch.keyExplain || rc.keyExplain,
        keyExplainZh: replyBranch.keyExplainZh || rc.keyExplainZh,
        natural: replyBranch.natural || rc.natural,
        vocab: replyBranch.vocab || rc.vocab,
        grammar: rc.grammar,
        grammarZh: rc.grammarZh,
        keywords: rc.keywords
      };
    }
    var tokens = (answer.toLowerCase().match(/[a-z']+/g) || []);
    var hits = tokens.filter(function(tk){ return rc.keywords.indexOf(tk)!==-1; }).length;
    var politeness = /please|could you|can i|excuse me|would you|thank/i.test(answer);
    var wordCount = tokens.length;
    var closeToNatural = answer.toLowerCase().indexOf(rc.keyPhrase.toLowerCase().replace(/[…\.\?]/g,"").split(" / ")[0].trim())!==-1;

    var bucket;
    if(wordCount===0){ bucket = "unclear"; }
    else if(wordCount<=2 && hits===0){ bucket = "unclear"; }
    else if(hits===0){ bucket = "unclear-soft"; }
    else if(closeToNatural || (politeness && hits>=2)){ bucket = "natural-already"; }
    else { bucket = "clear-needs-polish"; }

    return {
      bucket: bucket,
      naturalVersion: rc.natural,
      keyPhrase: rc.keyPhrase,
      keyExplain: rc.keyExplain,
      keyExplainZh: rc.keyExplainZh,
      vocab: rc.vocab,
      grammar: rc.grammar,
      grammarZh: rc.grammarZh,
      showComparison: bucket==="clear-needs-polish" || bucket==="natural-already"
    };
  }

  function renderFeedback(scenario, answer, fb, opts){
    opts = opts || {};
    var panel = byId("feedbackPanel");
    var banner = t("banners")[fb.bucket];
    var explain = state.lang==="zh" ? fb.keyExplainZh : fb.keyExplain;
    var grammarText = state.lang==="zh" ? fb.grammarZh : fb.grammar;

    var vocabHtml = fb.vocab.map(function(v){
      var meaning = state.lang==="zh" ? v.meaningZh : v.meaning;
      return '<div class="vocab-chip"><b>'+v.word+'</b><span class="m">'+meaning+'</span><span class="m" style="font-style:italic;">"'+v.example+'"</span></div>';
    }).join("");

    var html = "";
    html += '<div class="result-banner'+(banner.soft?' result-soft':'')+'">'+
              '<span class="glyph">'+banner.glyph+'</span>'+
              '<div><div class="msg">'+banner.msg+'</div><div class="sub">'+banner.sub+'</div></div>'+
            '</div>';

    html += '<div class="fb-block"><span class="mono-label">'+t("yourAnswer")+'</span><div class="quote-card">"'+escapeHtml(answer)+'"</div></div>';

    html += '<div class="fb-block"><span class="mono-label">'+(fb.showComparison?t("naturalWayCompare"):t("naturalWaySingle"))+'</span>'+
              '<div class="natural-card"><span class="text">'+fb.naturalVersion+'</span>'+
              '<button class="icon-btn" id="playNaturalBtn" title="Play pronunciation">🔊</button></div></div>';

    html += '<div class="fb-block"><span class="mono-label">'+t("keyToday")+'</span>'+
              '<div class="phrase-card"><div class="phrase">'+fb.keyPhrase+'</div><div class="explain">'+explain+'</div></div></div>';

    if(grammarText){
      html += '<div class="fb-block"><span class="mono-label">'+t("grammarBrief")+'</span><div class="grammar-note">'+grammarText+'</div></div>';
    }
    if(fb.vocab.length){
      html += '<div class="fb-block"><span class="mono-label">'+t("newVocab")+'</span><div class="vocab-row">'+vocabHtml+'</div></div>';
    }

    html += '<div class="say-it-module">'+
              '<span class="mono-label">'+t("practiceSaying")+'</span>'+
              '<div class="say-it-controls">'+
                '<button class="btn btn-ghost btn-sm" id="playModelBtn">'+t("playModel")+'</button>'+
                '<button class="icon-btn" id="recordSayBtn" title="Record yourself">🎙️</button>'+
                '<audio class="playback" id="sayPlayback" controls style="display:none;"></audio>'+
              '</div>'+
              '<p class="say-it-hint" id="sayItHint">'+t("sayItHint")+'</p>'+
            '</div>';

    if(opts.mode === "conversation"){
      if(opts.needsRetry){
        html += '<div class="feedback-cta"><button class="btn btn-primary" id="convRetryBtn">'+t("tryAgainBtn")+'</button></div>';
      } else {
        html += '<div class="feedback-cta"><button class="btn btn-primary" id="convContinueBtn">'+(opts.isLast?t("convFinishBtn"):t("convContinueBtn"))+'</button></div>';
      }
    } else {
      html += '<div class="feedback-cta">'+
                '<button class="btn btn-primary" id="tryAgainBtn">'+t("tryAgainBtn")+'</button>'+
                '<button class="btn btn-ghost" data-nav="scenarios">'+t("chooseOther")+'</button>'+
              '</div>';
    }

    panel.innerHTML = html;
    panel.classList.add("open");
    panel.querySelectorAll("[data-nav]").forEach(function(btn){
      btn.addEventListener("click", function(){ navigate(btn.getAttribute("data-nav")); });
    });

    byId("playNaturalBtn").addEventListener("click", function(){ speak(fb.naturalVersion); });
    byId("playModelBtn").addEventListener("click", function(){ speak(fb.naturalVersion); });

    if(opts.mode === "conversation"){
      if(opts.needsRetry){
        byId("convRetryBtn").addEventListener("click", function(){
          panel.classList.remove("open");
          panel.innerHTML = "";
          byId("answerInput").value = "";
          byId("answerInput").focus();
        });
      } else {
        byId("convContinueBtn").addEventListener("click", function(){
          advanceConversation(scenario);
        });
      }
    } else {
      byId("tryAgainBtn").addEventListener("click", function(){
        var nextVariant = (state.variantIndex + 1);
        openScenario(scenario.id, nextVariant);
        window.scrollTo({top:0, behavior:"smooth"});
      });
    }

    setupSayItRecorder();
  }

  function setupSayItRecorder(){
    var btn = byId("recordSayBtn");
    var audioEl = byId("sayPlayback");
    var hint = byId("sayItHint");
    var localRecorder = null, localChunks = [], active = false;

    btn.addEventListener("click", function(){
      if(active){
        if(localRecorder && localRecorder.state!=="inactive") localRecorder.stop();
        active = false;
        btn.classList.remove("recording");
        return;
      }
      if(!state.mediaRecorderSupported){
        hint.textContent = t("sayItNoMic");
        return;
      }
      navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
        localChunks = [];
        localRecorder = new MediaRecorder(stream);
        localRecorder.ondataavailable = function(e){ if(e.data.size>0) localChunks.push(e.data); };
        localRecorder.onstop = function(){
          stream.getTracks().forEach(function(tr){ tr.stop(); });
          var blob = new Blob(localChunks, {type:"audio/webm"});
          audioEl.src = URL.createObjectURL(blob);
          audioEl.style.display = "";
          hint.textContent = t("sayItHintDone");
        };
        localRecorder.start();
        active = true;
        btn.classList.add("recording");
        hint.textContent = t("sayItHintRecording");
      }).catch(function(){
        hint.textContent = t("sayItNoAccess");
      });
    });
  }

  function speak(text){
    if(!("speechSynthesis" in window)){
      alert("Speech playback isn't supported in this browser.");
      return;
    }
    window.speechSynthesis.cancel();
    var utter = new SpeechSynthesisUtterance(text);
    utter.lang = "en-US";
    utter.rate = 0.95;
    var voices = window.speechSynthesis.getVoices();
    var enVoice = voices.find(function(v){ return /en-US/i.test(v.lang); }) || voices.find(function(v){ return /^en/i.test(v.lang); });
    if(enVoice) utter.voice = enVoice;
    window.speechSynthesis.speak(utter);
  }
  if("speechSynthesis" in window){
    window.speechSynthesis.onvoiceschanged = function(){};
  }

  function escapeHtml(str){
    return str.replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  /* ============================================================
     TRAVEL ENGLISH CARDS — view logic
     ============================================================ */
  function matchesTravelQuery(card, query){
    if(!query) return true;
    var q = query.trim().toLowerCase();
    if(!q) return true;
    var hay = [card.chinese, card.english, card.alternative||"", card.possibleReply||""]
      .concat((card.vocab||[]).map(function(v){ return v.word+" "+(v.meaningZh||""); }))
      .join(" ").toLowerCase();
    return hay.indexOf(q)!==-1;
  }

  function filteredTravelCards(){
    return TRAVEL_CARDS.filter(function(c){
      if(state.travelCategory && c.category!==state.travelCategory) return false;
      if(state.travelType!=="All" && c.cardType!==state.travelType) return false;
      if(!matchesTravelQuery(c, state.travelQuery)) return false;
      return true;
    });
  }

  function renderTravelCatGrid(){
    var grid = byId("travelCatGrid");
    grid.innerHTML = "";
    TRAVEL_CATEGORIES.forEach(function(cat){
      var count = TRAVEL_CARDS.filter(function(c){ return c.category===cat.id; }).length;
      var tile = document.createElement("button");
      tile.className = "travel-cat-tile";
      tile.innerHTML = '<span class="glyph">'+cat.icon+'</span><span class="label">'+(state.lang==="zh"?cat.zh:cat.en)+'</span><span class="count">'+t("travelCatCount")(count)+'</span>';
      tile.addEventListener("click", function(){
        state.travelCategory = cat.id;
        state.travelType = "All";
        renderTravelView();
        window.scrollTo({top:0, behavior:"smooth"});
      });
      grid.appendChild(tile);
    });
  }

  function renderTravelTypeTabs(){
    var wrap = byId("travelTypeTabs");
    wrap.innerHTML = "";
    var types = ["All","how_to_say","what_they_might_ask","travel_vocabulary","emergency"];
    types.forEach(function(ty){
      var b = document.createElement("button");
      b.className = "travel-type-tab" + (state.travelType===ty ? " active":"");
      var label = ty==="All" ? (state.lang==="zh"?"全部":"All") : (TRAVEL_CARD_TYPES[ty].icon+" "+(state.lang==="zh"?TRAVEL_CARD_TYPES[ty].zh:TRAVEL_CARD_TYPES[ty].en));
      b.textContent = label;
      b.addEventListener("click", function(){
        state.travelType = ty;
        renderTravelCardGrid();
        renderTravelTypeTabs();
      });
      wrap.appendChild(b);
    });
  }

  function travelCardHtml(card){
    var catInfo = null;
    for(var i=0;i<TRAVEL_CATEGORIES.length;i++){ if(TRAVEL_CATEGORIES[i].id===card.category) catInfo = TRAVEL_CATEGORIES[i]; }
    var typeInfo = TRAVEL_CARD_TYPES[card.cardType];
    var catLabel = catInfo ? (catInfo.icon+" "+(state.lang==="zh"?catInfo.zh:catInfo.en)) : "";
    var typeLabel = typeInfo ? (typeInfo.icon+" "+(state.lang==="zh"?typeInfo.zh:typeInfo.en)) : "";

    var vocabHtml = (card.vocab||[]).map(function(v){
      var linkedWord = wordByEnglish(v.word);
      var cls = "vocab-chip" + (linkedWord ? " clickable" : "");
      var attr = linkedWord ? ' data-word-id="'+linkedWord.id+'" data-stop' : '';
      return '<div class="'+cls+'"'+attr+'><b>'+escapeHtml(v.word)+'</b><span class="m">'+escapeHtml(v.meaningZh||"")+'</span></div>';
    }).join("");

    var body = '<div class="travel-card-body">';
    body += '<div class="travel-card-en-row"><span class="en">'+escapeHtml(card.english)+'</span><button class="icon-btn travel-card-listen" data-stop title="'+t("travelListenBtn")+'">🔊</button></div>';
    if(card.cardType==="what_they_might_ask" && card.possibleReply){
      body += '<div class="travel-card-sub"><span class="mono-label">'+t("travelReplyLabel")+'</span><div class="quote-card-row"><div class="quote-card">"'+escapeHtml(card.possibleReply)+'"</div><button class="icon-btn icon-btn-sm mini-listen-btn" data-stop data-speak="'+escapeHtml(card.possibleReply)+'" title="'+t("travelListenBtn")+'">🔊</button></div></div>';
    }
    if(card.alternative){
      body += '<div class="travel-card-sub"><span class="mono-label">'+t("travelAltLabel")+'</span><div class="quote-card-row"><div class="quote-card">"'+escapeHtml(card.alternative)+'"</div><button class="icon-btn icon-btn-sm mini-listen-btn" data-stop data-speak="'+escapeHtml(card.alternative)+'" title="'+t("travelListenBtn")+'">🔊</button></div></div>';
    }
    if(vocabHtml){
      body += '<div class="travel-card-sub"><span class="mono-label">'+t("travelVocabLabel")+'</span><div class="vocab-row">'+vocabHtml+'</div></div>';
    }
    body += '<div class="travel-card-cta-row">';
    if(card.scenarioId){
      body += '<button class="btn btn-primary btn-sm travel-card-practice" data-stop>'+t("travelPracticeBtn")+'</button>';
    } else {
      body += '<button class="btn btn-ghost btn-sm" data-stop disabled>'+t("travelPracticeUnavailable")+'</button>';
    }
    body += '</div></div>';

    return '<div class="travel-card" data-id="'+card.id+'">'+
      '<div class="travel-card-top">'+
        '<span class="travel-card-cat">'+catLabel+' · '+typeLabel+'</span>'+
      '</div>'+
      '<div class="travel-card-zh">'+escapeHtml(card.chinese)+'</div>'+
      '<div class="travel-card-en-preview">'+escapeHtml(card.english)+'</div>'+
      body+
    '</div>';
  }

  function renderTravelCardGrid(){
    var grid = byId("travelCardGrid");
    var searching = state.travelQuery.trim().length>0;
    var showAnyGrid = searching || !!state.travelCategory;
    if(!showAnyGrid){
      grid.innerHTML = "";
      byId("travelEmpty").style.display = "none";
      return;
    }
    var cards = filteredTravelCards();
    if(!cards.length){
      grid.innerHTML = "";
      byId("travelEmpty").style.display = "";
      byId("travelEmpty").textContent = t("travelEmptyResults");
      return;
    }
    byId("travelEmpty").style.display = "none";
    grid.innerHTML = cards.map(travelCardHtml).join("");
    grid.querySelectorAll(".travel-card").forEach(function(el){
      var id = el.getAttribute("data-id");
      el.addEventListener("click", function(e){
        if(e.target.closest("[data-stop]")) return;
        el.classList.toggle("open");
      });
      var listenBtn = el.querySelector(".travel-card-listen");
      if(listenBtn){
        listenBtn.addEventListener("click", function(e){
          e.stopPropagation();
          var card = travelCardById(id);
          if(card) speak(card.english);
        });
      }
      el.querySelectorAll(".mini-listen-btn").forEach(function(btn){
        btn.addEventListener("click", function(e){
          e.stopPropagation();
          speak(btn.getAttribute("data-speak"));
        });
      });
      var practiceBtn = el.querySelector(".travel-card-practice");
      if(practiceBtn){
        practiceBtn.addEventListener("click", function(e){
          e.stopPropagation();
          var card = travelCardById(id);
          if(card && card.scenarioId) navigate("practice", {scenarioId:card.scenarioId});
        });
      }
      el.querySelectorAll(".vocab-chip.clickable").forEach(function(chip){
        chip.addEventListener("click", function(e){
          e.stopPropagation();
          navigate("travel-words", {openWordId: chip.getAttribute("data-word-id")});
        });
      });
    });
  }

  function openCardById(id){
    var c = travelCardById(id);
    if(!c) return;
    state.travelCategory = c.category;
    state.travelType = "All";
    state.travelQuery = "";
    byId("travelSearch").value = "";
    renderTravelView();
    setTimeout(function(){
      var el = document.querySelector('.travel-card[data-id="'+id+'"]');
      if(el){
        el.classList.add("open");
        el.scrollIntoView({behavior:"smooth", block:"center"});
      }
    }, 30);
  }

  function renderTravelView(){
    renderTravelCatGrid();
    var searching = state.travelQuery.trim().length>0;
    var showList = searching || !!state.travelCategory;
    byId("travelCatGrid").style.display = showList ? "none" : "";
    byId("travelFilterWrap").style.display = showList ? "" : "none";
    if(showList) renderTravelTypeTabs();
    renderTravelCardGrid();
  }

  byId("travelSearch").addEventListener("input", function(e){
    state.travelQuery = e.target.value;
    renderTravelView();
  });
  byId("travelBackToCats").addEventListener("click", function(){
    state.travelCategory = null;
    state.travelType = "All";
    state.travelQuery = "";
    byId("travelSearch").value = "";
    renderTravelView();
  });

  /* ============================================================
     TRAVEL ENGLISH — landing page (3 entry points)
     ============================================================ */
  function renderTravelEntryGrid(){
    var grid = byId("travelEntryGrid");
    grid.innerHTML =
      '<button class="travel-entry-tile" data-entry="words">'+
        '<span class="glyph">🔤</span>'+
        '<span class="title">'+t("travelEntryWordsTitle")+'</span>'+
        '<span class="desc">'+t("travelEntryWordsDesc")+'</span>'+
        '<span class="count">'+t("travelEntryWordCount")(TRAVEL_WORDS.length)+'</span>'+
      '</button>'+
      '<button class="travel-entry-tile" data-entry="cards">'+
        '<span class="glyph">💬</span>'+
        '<span class="title">'+t("travelEntryCardsTitle")+'</span>'+
        '<span class="desc">'+t("travelEntryCardsDesc")+'</span>'+
        '<span class="count">'+t("travelEntryCount")(TRAVEL_CARDS.length)+'</span>'+
      '</button>'+
      '<button class="travel-entry-tile" data-entry="practice">'+
        '<span class="glyph">🗣️</span>'+
        '<span class="title">'+t("travelEntryPracticeTitle")+'</span>'+
        '<span class="desc">'+t("travelEntryPracticeDesc")+'</span>'+
      '</button>';
    grid.querySelectorAll(".travel-entry-tile").forEach(function(el){
      el.addEventListener("click", function(){
        var entry = el.getAttribute("data-entry");
        if(entry==="cards") navigate("travel-cards");
        else if(entry==="words") navigate("travel-words");
        else navigate("scenarios");
      });
    });
  }

  /* ============================================================
     TRAVEL ENGLISH WORDS ("旅行英文單字") — view logic
     ============================================================ */
  function wordById(id){ for(var i=0;i<TRAVEL_WORDS.length;i++){ if(TRAVEL_WORDS[i].id===id) return TRAVEL_WORDS[i]; } return null; }
  function wordByEnglish(text){
    var norm = String(text||"").trim().toLowerCase();
    if(!norm) return null;
    for(var i=0;i<TRAVEL_WORDS.length;i++){ if(TRAVEL_WORDS[i].english.toLowerCase()===norm) return TRAVEL_WORDS[i]; }
    return null;
  }

  function matchesWordQuery(w, query){
    if(!query) return true;
    var q = query.trim().toLowerCase();
    if(!q) return true;
    var hay = [w.english, w.chineseMeaning, w.example, w.exampleZh].concat(w.keywords||[]).join(" ").toLowerCase();
    return hay.indexOf(q)!==-1;
  }
  function filteredWords(){
    return TRAVEL_WORDS.filter(function(w){
      if(state.wordCategory && w.category!==state.wordCategory) return false;
      if(!matchesWordQuery(w, state.wordQuery)) return false;
      return true;
    });
  }

  function renderWordCatTabs(){
    var wrap = byId("wordCatTabs");
    wrap.innerHTML = "";
    var allBtn = document.createElement("button");
    allBtn.className = "word-cat-tab" + (!state.wordCategory ? " active" : "");
    allBtn.textContent = t("wordCatAll");
    allBtn.addEventListener("click", function(){
      state.wordCategory = null;
      renderWordsView();
    });
    wrap.appendChild(allBtn);
    WORD_CATEGORIES.forEach(function(cat){
      var b = document.createElement("button");
      b.className = "word-cat-tab" + (state.wordCategory===cat.id ? " active" : "");
      b.textContent = cat.icon+" "+(state.lang==="zh"?cat.zh:cat.en);
      b.addEventListener("click", function(){
        state.wordCategory = cat.id;
        renderWordsView();
      });
      wrap.appendChild(b);
    });
  }

  function wordCardHtml(word){
    var catInfo = null;
    for(var i=0;i<WORD_CATEGORIES.length;i++){ if(WORD_CATEGORIES[i].id===word.category) catInfo = WORD_CATEGORIES[i]; }
    var catLabel = catInfo ? (catInfo.icon+" "+(state.lang==="zh"?catInfo.zh:catInfo.en)) : "";
    var typeLabels = t("wordEntryTypeLabels");
    var typeLabel = typeLabels ? (typeLabels[word.entryType]||word.entryType) : word.entryType;

    var relatedWords = (word.relatedWordIds||[]).map(wordById).filter(Boolean);
    var relatedHtml = relatedWords.length ? (
      '<div class="travel-card-sub"><span class="mono-label">'+t("wordRelatedLabel")+'</span>'+
      '<div class="word-related-row">'+relatedWords.map(function(rw){
        return '<button class="word-related-chip" data-stop data-related-id="'+rw.id+'">'+escapeHtml(rw.english)+'</button>';
      }).join("")+'</div></div>'
    ) : "";

    var body = '<div class="travel-card-body">';
    body += '<div class="travel-card-en-row"><span class="en">'+escapeHtml(word.english)+'</span><button class="icon-btn word-listen" data-stop title="'+t("wordListenBtn")+'">🔊</button></div>';
    body += '<div class="travel-card-sub"><span class="mono-label">'+t("wordExampleLabel")+'</span><div class="quote-card-row"><div class="quote-card">"'+escapeHtml(word.example)+'"<br><span style="color:var(--ink-soft);font-size:0.85rem;">'+escapeHtml(word.exampleZh)+'</span></div><button class="icon-btn icon-btn-sm mini-listen-btn" data-stop data-speak="'+escapeHtml(word.example)+'" title="'+t("wordListenBtn")+'">🔊</button></div></div>';
    body += relatedHtml;
    if(word.relatedCardId){
      body += '<div class="travel-card-sub"><span class="mono-label">'+t("wordUsedInCardLabel")+'</span>'+
        '<button class="btn btn-ghost btn-sm word-view-card" data-stop data-card-id="'+word.relatedCardId+'">'+t("wordViewCardBtn")+'</button></div>';
    }
    if(word.scenarioId){
      body += '<div class="travel-card-cta-row">'+
        '<button class="btn btn-primary btn-sm word-try-scenario" data-stop data-scenario-id="'+word.scenarioId+'">'+t("wordTryScenarioBtn")+'</button></div>';
    }
    body += '</div>';

    return '<div class="word-card travel-card" data-id="'+word.id+'">'+
      '<div class="travel-card-top">'+
        '<span class="travel-card-cat">'+catLabel+' · '+typeLabel+'</span>'+
      '</div>'+
      '<div class="travel-card-zh">'+escapeHtml(word.chineseMeaning)+'</div>'+
      '<div class="travel-card-en-preview">'+escapeHtml(word.english)+'</div>'+
      body+
    '</div>';
  }

  function renderWordCardGrid(){
    var grid = byId("wordCardGrid");
    var words = filteredWords();
    if(!words.length){
      grid.innerHTML = "";
      byId("wordsEmpty").style.display = "";
      byId("wordsEmpty").textContent = t("wordEmptyResults");
      return;
    }
    byId("wordsEmpty").style.display = "none";
    grid.innerHTML = words.map(wordCardHtml).join("");
    grid.querySelectorAll(".word-card").forEach(function(el){
      var id = el.getAttribute("data-id");
      el.addEventListener("click", function(e){
        if(e.target.closest("[data-stop]")) return;
        el.classList.toggle("open");
      });
      var listenBtn = el.querySelector(".word-listen");
      if(listenBtn){
        listenBtn.addEventListener("click", function(e){
          e.stopPropagation();
          var w = wordById(id);
          if(w) speak(w.english);
        });
      }
      el.querySelectorAll(".mini-listen-btn").forEach(function(btn){
        btn.addEventListener("click", function(e){
          e.stopPropagation();
          speak(btn.getAttribute("data-speak"));
        });
      });
      el.querySelectorAll(".word-related-chip").forEach(function(chip){
        chip.addEventListener("click", function(e){
          e.stopPropagation();
          openWordById(chip.getAttribute("data-related-id"));
        });
      });
      var viewCardBtn = el.querySelector(".word-view-card");
      if(viewCardBtn){
        viewCardBtn.addEventListener("click", function(e){
          e.stopPropagation();
          navigate("travel-cards", {openCardId: viewCardBtn.getAttribute("data-card-id")});
        });
      }
      var tryScenarioBtn = el.querySelector(".word-try-scenario");
      if(tryScenarioBtn){
        tryScenarioBtn.addEventListener("click", function(e){
          e.stopPropagation();
          navigate("practice", {scenarioId: tryScenarioBtn.getAttribute("data-scenario-id")});
        });
      }
    });
  }

  function openWordById(id){
    var w = wordById(id);
    if(!w) return;
    state.wordCategory = w.category;
    state.wordQuery = "";
    byId("wordSearch").value = "";
    renderWordsView();
    setTimeout(function(){
      var el = document.querySelector('.word-card[data-id="'+id+'"]');
      if(el){
        el.classList.add("open");
        el.scrollIntoView({behavior:"smooth", block:"center"});
      }
    }, 30);
  }

  function renderWordsView(){
    renderWordCatTabs();
    renderWordCardGrid();
  }

  byId("wordSearch").addEventListener("input", function(e){
    state.wordQuery = e.target.value;
    renderWordsView();
  });

  /* ============================================================
     INIT
     ============================================================ */
  applyTheme(currentTheme);
  applyStaticText();
  renderTravelFlowRow();
  renderCatTabs();
  renderScenarios();
  navigate("home");
})();
</script>
